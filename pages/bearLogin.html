<!DOCTYPE html>
<html>
<head>
    <style>
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            height: 100vh;
        }

        .bear {
            height: 100px;
            width: 150px;

            margin-bottom: 30px;
            border-radius: 50%;
            background-color: brown;
          
        }
        #ears {
            position: relative;

            padding-left: 10px;
            padding-right: 10px;

            display: flex;
            flex-direction: row;
            justify-content: space-between;

            transition-duration: 0.5s;
        }
        .ear {
            width: 30px;
            height: 30px;
            border-top-right-radius: 50%;
            border-top-left-radius: 50%;

            /* background-color: red; */
            background-color: brown;
        }
        .ear:first-child {transform: rotate(-20deg);}
        .ear:last-child {transform: rotate(20deg);}
        #eyes {
            position: relative;
        
            padding-top: 10px;
            padding-left: 30px;
            padding-right: 30px;
           
            display: flex;
            flex-direction: row;
            justify-content: space-between;

            transition-duration: 0.5s;
        }
        .eye {
            width: 20px;
            height: 20px;
            background-color: #000;
            border-radius: 50%;

            transition-duration: 0.5s;
        }
        #snout {
            position: relative;
            margin-left: 30px;
            margin-right: 30px;
            height: 40px;
            
            padding-left: 35px;
            padding-right: 35px;

            border-radius: 50%;
            background-color: rgb(191, 90, 90);

            transition-duration: 0.5s;
        }
        #nose {
            position: relative;
            top: 2px;
            border: 10px solid transparent;
            border-top: 10px solid #000;

            transition-duration: 0.5s;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {      
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            background: #007bff;
            color: white;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <a style="position: absolute; top: 30px; left: 30px" href="../index.html">back</a>
    
    <div class="container">
        <div class="bear">
            <div id="ears">
                <div class="ear"></div>
                <div class="ear"></div>
            </div>
            <div id="eyes">
                <div class="eye"></div>
                <div class="eye"></div>
            </div>
            <div id="snout"><div id="nose"></div></div>
        </div>
    
        <form>
            <input type="email" placeholder="Email" id="email">
            <input type="password" placeholder="Password" id="password">
            <button>Create a free account</button>
        </form>
    </div>

    <script>
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        function move(object, multiplier, leftIndent, bottomIndent, position) {
            position = emailInput.value.length*multiplier>=leftIndent*2 ? leftIndent*2 : emailInput.value.length*multiplier;
            object.style.transform = `translate(${position-leftIndent}px, ${bottomIndent}px)`;
        }

        /* EARS */
        const ears = document.getElementById('ears');
        const earsMultiplier = 0.38;
        const earsLeftIndent = 5;
        const earsBottomIndent = 5;
        let earsPosition = 0;
        /* EARS */

        /* EYES */
        const eyes = document.getElementById('eyes');
        const eyesMultiplier = 2;
        const eyesLeftIndent = 25;
        const eyesBottomIndent = 14;
        let eyesPosition = 0;
        /* EYES */

        /* SNOUT */
        const snout = document.getElementById('snout');
        const snoutMultiplier = 1.58;
        const snoutLeftIndent = 20;
        const snoutBottomIndent = 10;
        let snoutPosition = 0;
        /* SNOUT */

        /* NOSE */
        const nose = document.getElementById('nose');
        const noseMultiplier = 1.58;
        const noseLeftIndent = 20;
        const noseBottomIndent = 10;
        let nosePosition = 0;
        /* NOSE */
        /* ---EMAIL--- */
        emailInput.addEventListener('focus', () => {
            move(ears, earsMultiplier, earsLeftIndent, earsBottomIndent, earsPosition);
            move(eyes, eyesMultiplier, eyesLeftIndent, eyesBottomIndent, eyesPosition);
            move(snout, snoutMultiplier, snoutLeftIndent, snoutBottomIndent, snoutPosition);
            move(nose, noseMultiplier, noseLeftIndent, noseBottomIndent, nosePosition);
            snout.style.height = `35px`;
        });
        emailInput.addEventListener('blur', () => {
            ears.style.transform = `translate(0px,0px)`;
            eyes.style.transform = `translate(0px,0px)`;
            snout.style.transform = `translate(0px,0px)`;
            snout.style.height = `40px`;
            nose.style.transform = `translate(0px,0px)`;
        });
    
        emailInput.addEventListener('input', () => {
            move(ears, earsMultiplier, earsLeftIndent, earsBottomIndent, earsPosition);
            move(eyes, eyesMultiplier, eyesLeftIndent, eyesBottomIndent, eyesPosition);
            move(snout, snoutMultiplier, snoutLeftIndent, snoutBottomIndent, snoutPosition);
            move(nose, noseMultiplier, noseLeftIndent, noseBottomIndent, nosePosition);
        });
        /* ---EMAIL--- */

        /* ---PASSWORD--- */
        const eye1 = document.getElementsByClassName('eye')[0];
        const eye2 = document.getElementsByClassName('eye')[1];
        passwordInput.addEventListener('focus', () => {
            eye1.style.height = `2px`;
            eye1.style.margin = `7px 0px`;
            eye2.style.height = `2px`;
            eye2.style.margin = `7px 0px`;
        });
        passwordInput.addEventListener('blur', () => {
            eye1.style.height = `20px`;
            eye1.style.margin = `0px 0px`;
            eye2.style.height = `20px`;
            eye2.style.margin = `0px 0px`;
        });
        /* ---PASSWORD--- */

    </script>
</body>
</html>
